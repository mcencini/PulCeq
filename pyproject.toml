[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "setuptools_scm[toml]", "wheel"]

[project]
name = "pypulseg"
description = "An high level abstraction layer over the Pulseq specification."
readme = "README.md"

requires-python = ">=3.10"
dynamic = ["version"]

license = {file = "LICENSE"}
keywords = ["pulseq", "mri", "sequence-design", "pulse-sequences", "mri-sequences"]

authors = [
  {name = "Jon Fredrik Nielsen"}, # Optional
  {name = "Matteo Cencini"} # Optional
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
"click",
"numpy",
"pypulseq",
]

[project.optional-dependencies]
dev = ["black", "isort", "pytest", "pytest-black", "pytest-cov", "pytest-sugar", "pytest-xdist"]
doc = ["sphinx", "pydata-sphinx-theme", "myst-nb", "matplotlib", "sphinx-copybutton"]

[project.urls]
"Homepage" = "https://github.com/HarmonizedMRI/PulCeq"
"Bug Reports" = "https://github.com/HarmonizedMRI/PulCeqr/issues"
"Source" = "https://github.com/HarmonizedMRI/PulCeq/pulserver"

[project.scripts]  # Optional
pypulseg = "pypulseg._cli:cli"

[tool.setuptools.packages.find]
where=["python"]

[tool.setuptools_scm]
write_to = "python/pypulseg/_version.py"
version_scheme = "python-simplified-semver"
local_scheme="no-local-version"
fallback_version="v99-dev"

# Formatting using black.
[tool.black]

# Linting using ruff.
[tool.ruff]
src = ["src", "tests"]
select = ["E", "F", "B", "Q", "D", "UP", "ANN"]
extend-exclude = [ 
"example_*.py" , 
"*_version.py", 
"test_*.py", 
"tests", 
]

ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls in classmethod.
    "ANN204", # missing return type for __init__
    "D105", # missing docstring in magic method
    "D404", # Imperative mode is not necessary everywhere, trust me.
    "B905", # zip() without an explicit strict= parameter
    "B028", # No explicit stacklevel keyword argument found
    "F401", # Using ``try: import ... except:`` is nice.
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.isort]
profile="black"

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath  = ["tests"]
testpaths=["tests"]
addopts = [
    "--import-mode=importlib",
    "--cov=pulserver",
    "--cov-report=term-missing",
    "--cov-report=xml"
]

[tool.pylsp-mypy]
enabled = false
live_mode = false

[tool.mypy]
ignore_missing_imports = true